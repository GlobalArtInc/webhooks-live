[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing attack on RSA decryption and signing with a private key; the only use here is public-key ID token signature verification inside openidconnect, which has no fix available" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, reached only through oauth2 and openidconnect; no vulnerability, replace when openidconnect moves off it" },
]

[licenses]
allow = [
    "CDLA-Permissive-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
