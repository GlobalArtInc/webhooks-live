[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/GlobalArtInc/webhooks-live"

[workspace.dependencies]
whl-api = { path = "crates/whl-api" }
whl-auth = { path = "crates/whl-auth" }
whl-capture = { path = "crates/whl-capture" }
whl-core = { path = "crates/whl-core" }
whl-dns = { path = "crates/whl-dns" }
whl-export = { path = "crates/whl-export" }
whl-forward = { path = "crates/whl-forward" }
whl-live = { path = "crates/whl-live" }
whl-notify = { path = "crates/whl-notify" }
whl-rules = { path = "crates/whl-rules" }
whl-rules-worker = { path = "crates/whl-rules-worker" }
whl-script = { path = "crates/whl-script" }
whl-schedule = { path = "crates/whl-schedule" }
whl-mail = { path = "crates/whl-mail" }
whl-secrets = { path = "crates/whl-secrets" }
whl-server = { path = "crates/whl-server" }
whl-store = { path = "crates/whl-store" }
whl-telemetry = { path = "crates/whl-telemetry" }
whl-template = { path = "crates/whl-template" }
whl-testkit = { path = "crates/whl-testkit" }
whl-verify = { path = "crates/whl-verify" }
whl-web = { path = "crates/whl-web" }

async_zip = { version = "0.0.19", default-features = false, features = ["tokio", "deflate"] }
axum = "0.8"
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
bytes = "1"
bytesize = "2"
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["env", "toml"] }
http = "1"
ipnet = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls"] }
metrics-exporter-prometheus = { version = "0.17", default-features = false }
mimalloc = "0.1"
rand = { version = "0.9", default-features = false, features = ["os_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
utoipa = "5"
uuid = { version = "1", features = ["v7", "serde"] }
migrator = { package = "sqlmig", version = "0.2.1" }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "time"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "http2", "server-auto", "server-graceful", "tokio"] }
mime_guess = "2"
percent-encoding = "2"
multer = "3"
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }
rust-embed = "8"
sha1 = { version = "0.11", features = ["zeroize"] }
sha2 = { version = "0.11", features = ["zeroize"] }
tower = { version = "0.5", features = ["util"] }
dashmap = "6"
governor = { version = "0.10", default-features = false, features = ["std"] }
metrics = "0.24"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
hmac = { version = "0.13", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
subtle = "2"
zeroize = "1"
proptest = "1"
rand_chacha = "0.9"
serde_json_path = { version = "0.7", default-features = false, features = ["functions"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
rhai = { version = "=1.27.0", default-features = false, features = ["std", "sync", "no_module", "no_custom_syntax", "no_closure", "no_optimize", "no_time"] }
croner = { version = "4", default-features = false, features = ["jiff"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
mail-parser = "1.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
smtp-proto = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
