name: Build image

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Containerfile"
      - ".dockerignore"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: globalartltd/webhooks-live

jobs:
  build:
    name: Build and push the image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute the image tag
        id: tag
        run: |
          echo "version=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Write the image reference to the job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "- Image: \`${IMAGE}\`"
            echo "- Tags: \`${VERSION}\`, \`latest\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
